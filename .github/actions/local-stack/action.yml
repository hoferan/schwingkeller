name: Local Supabase stack
description: >-
  Starts the Compose backend, applies the migrations and the seed, creates the
  local test accounts, and points Vite and the tests at the stack.
runs:
  using: composite
  steps:
    - name: Start the Supabase backend
      # Every one of these reports health, so --wait blocks until the stack
      # can actually answer. `web` is left out on purpose: the E2E job serves
      # the app itself and the integration tests need no app. studio comes
      # along regardless as kong depends on it.
      shell: bash
      run: docker compose up -d --wait db kong auth rest storage imgproxy meta
    - name: Create the test accounts, apply migrations, seed venues
      # Both are one-shot containers, run in order: db-init sets the profiles
      # of the accounts admin-init creates. Each exit code is read on its own,
      # so a failed admin-init prints its log instead of dying inside `up -d`
      # and showing up much later as an unexplained login failure.
      shell: bash
      run: |
        run_once() {
          docker compose up -d "$@"
          service=${@: -1}
          id=$(docker compose ps -aq "$service")
          # `compose wait` errors out when the container has already exited.
          docker wait "$id" > /dev/null
          code=$(docker inspect -f '{{.State.ExitCode}}' "$id")
          if [ "$code" != "0" ]; then
            echo "$service exited with $code"
            docker compose logs --no-color "$service"
            exit 1
          fi
        }
        run_once admin-init
        run_once --no-deps db-init
    - name: Point Vite and the tests at the local stack
      # Read from docker/supabase.env rather than copied here, so rotating
      # the demo key in that file cannot leave a job on a stale one.
      shell: bash
      run: |
        echo "VITE_SUPABASE_URL=http://localhost:54321" >> "$GITHUB_ENV"
        echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(grep -m1 '^ANON_KEY=' docker/supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"
