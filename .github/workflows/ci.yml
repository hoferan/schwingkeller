name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for every job. all-green narrows this further to no scope
# at all, and any job needing more has to ask for it explicitly.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./test-report.junit.xml
          disable_search: true
          fail_ci_if_error: false
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Browser tests against the local Supabase stack. Only the backend runs in
  # containers: Vite runs on the runner, on the Node version in .nvmrc, so CI
  # never builds an image of the app just to serve it.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the Supabase backend
        # Every one of these reports health, so --wait blocks until the stack
        # can actually answer. `web` is left out on purpose, because Playwright
        # starts Vite itself; studio comes along regardless as kong depends on
        # it, which costs a few seconds and is not worth working around.
        run: docker compose up -d --wait db kong auth rest storage imgproxy meta
      - name: Apply migrations, seed venues, create the admin
        # Both are one-shot containers, so `up -d` returns before they finish.
        # Their exit codes are then read one at a time: `compose wait` over two
        # services reports a single code, and a silently failed admin-init
        # would otherwise reappear much later as an unexplained login failure.
        run: |
          docker compose up -d db-init admin-init
          docker compose wait db-init admin-init
          for service in db-init admin-init; do
            code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq "$service")")
            if [ "$code" != "0" ]; then
              echo "$service exited with $code"
              docker compose logs --no-color "$service"
              exit 1
            fi
          done
      - name: Point Vite at the local stack
        # Read from docker/supabase.env rather than copied here, so rotating
        # the demo key in that file cannot leave this job on a stale one.
        run: |
          echo "VITE_SUPABASE_URL=http://localhost:54321" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(grep -m1 '^ANON_KEY=' docker/supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Upload the Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Backend logs
        # A browser failure is usually a backend failure wearing a disguise.
        if: failure()
        run: docker compose logs --no-color --tail 200

  migrate:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # supabase/setup-cli v3.0.0
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # The single required check on main. A job added to this workflow does not
  # protect main until it is listed in `needs` here.
  all-green:
    # Runs even when a dependency fails. Without it the job would be skipped
    # on a failed run, leaving the required check unreported and the pull
    # request waiting instead of failing.
    if: always()
    needs: [build-test, e2e, migrate]
    # The job compares strings and calls nothing, so it has no use for the
    # token at all.
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every dependency succeeded
        # needs['build-test'] rather than needs.build-test: a hyphen in a job
        # id reads as subtraction in a GitHub expression, so the dotted form
        # yields an empty string and the guard below would pass on a failed
        # build. The echoed values make that visible: an empty result means
        # the reference did not resolve.
        run: |
          echo "build-test=${{ needs['build-test'].result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "migrate=${{ needs.migrate.result }}"
          [ "${{ needs['build-test'].result }}" = "success" ] || exit 1
          [ "${{ needs.e2e.result }}" = "success" ] || exit 1
          # migrate runs only on pushes to main, so a pull request always
          # skips it. That is not a failure.
          [ "${{ needs.migrate.result }}" = "success" ] || [ "${{ needs.migrate.result }}" = "skipped" ] || exit 1
