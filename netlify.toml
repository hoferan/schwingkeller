[build]
  command = "npm run build"
  publish = "dist"

# Netlify builds deploy previews and branch deploys. Production is published by
# the deploy job in .github/workflows/ci.yml, and auto-publishing is locked in
# the Netlify UI. Node comes from .nvmrc.

[context.deploy-preview.environment]
  VITE_APP_ENV = "stage"

[context.branch-deploy.environment]
  VITE_APP_ENV = "stage"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
